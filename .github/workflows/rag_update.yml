name: RAG Knowledge Update

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # allow manual trigger

jobs:
  update-knowledge-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r rag/requirements.txt

      - name: Restore cached ChromaDB
        uses: actions/cache@v4
        with:
          path: rag/data/chroma_db
          key: chroma-db-${{ hashFiles('rag/data/*.jsonl') }}
          restore-keys: |
            chroma-db-

      - name: Run PubMed scraper
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python rag/scrapers/pubmed_scraper.py

      - name: Run Radiopaedia scraper
        run: |
          python rag/scrapers/radiopaedia_scraper.py

      - name: Embed and index new cases
        run: |
          python rag/scripts/embed_and_index.py

      - name: Commit updated case data
        run: |
          git config user.name "NeuroRad RAG Bot"
          git config user.email "rag-bot@radiology4u.com"
          git add rag/data/*.jsonl
          git diff --cached --quiet || git commit -m "chore: weekly RAG knowledge update [skip ci]"
          git push

      - name: Upload ChromaDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chroma-db
          path: rag/data/chroma_db/
          retention-days: 30
